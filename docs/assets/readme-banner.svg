  <path d="M1081 217h53" stroke="#6c8cb9" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="1108" cy="217" r="13" fill="#233854"/>
  <circle cx="1108" cy="217" r="4" fill="#a9c7ff"/>
  <rect x="1153" y="151" width="181" height="124" rx="12" fill="#182434" stroke="#7898c1" stroke-width="3"/>
  <path d="M1220 276v26m-25 1h75" stroke="#7898c1" stroke-width="4" stroke-linecap="round"/>
  <path d="M1205 198h77m-77 16h56m-56 16h67" stroke="#a9c7ff" stroke-width="4" stroke-linecap="round"/>
